[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gov"
path = "src/bin/gov.rs"

[dependencies]
shared = { path = "../shared" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.53", features = ["gossipsub", "noise", "yamux", "tcp", "tokio", "macros"] }
futures = "0.3"
rand = "0.8"
anyhow = "1"
