apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-gateway
  labels:
    app: tailscale-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tailscale-gateway
  template:
    metadata:
      labels:
        app: tailscale-gateway
    spec:
      containers:
      - name: gateway
        image: gateway:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: UDP
          name: quic
        - containerPort: 8081
          protocol: TCP
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 2
          periodSeconds: 5
        env:
        - name: RUST_LOG
          value: "info"
        - name: GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: gateway-secrets
              key: token
        volumeMounts:
        - name: certs
          mountPath: /etc/gateway/certs
          readOnly: true
        args:
        - "--port"
        - "8080"
        - "--ca"
        - "/etc/gateway/certs/ca.crt"
        - "--cert"
        - "/etc/gateway/certs/server.crt"
        - "--key"
        - "/etc/gateway/certs/server.key"
      volumes:
      - name: certs
        secret:
          secretName: gateway-certs
