# This is a template. In a real environment, you should use SealedSecrets or a secure vault.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-certs
type: Opaque
data:
  ca.crt: <base64-encoded-ca-cert>
  server.crt: <base64-encoded-server-cert>
  server.key: <base64-encoded-server-key>
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
type: Opaque
stringData:
  token: "<REPLACE_WITH_STRONG_RANDOM_TOKEN>"
